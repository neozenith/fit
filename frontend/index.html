<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser paints this before any CSS loads, so a dark-mode user does
         not get a white flash on every navigation. -->
    <meta name="color-scheme" content="light dark" />
    <title>fit</title>

    <!-- The SVG favicon carries the SAME theme logic as the app: it defines its
         palette from `prefers-color-scheme` and honours `data-theme`, so the tab
         icon inverts with everything else. Browsers that ignore SVG favicons
         fall through to the PNGs, which is why both are declared. -->
    <link rel="icon" type="image/svg+xml" href="/brand/fit-icon-themed.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#5c4295" />

    <!-- Preloaded because it is the display face: the wordmark and every
         heading use it, so a late swap reflows the page above the fold. -->
    <link
      rel="preload"
      href="/fonts/Fraunces.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
