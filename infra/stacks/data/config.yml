# Data stack configuration.
#
# The hot window is the one number here that is a real trade-off. 13 months,
# not 12, so a year-on-year comparison is always answerable from DynamoDB alone
# and never has to reach the Parquet archive (ADR-0012).

app_name: fit
region: ap-southeast-2

environments:
  dev:
    # Dev holds throwaway data; a 1-month window exercises the age-out job
    # continuously instead of once a year, which is the only way its bugs are
    # ever found before they matter.
    hot_window_months: 1
  test:
    hot_window_months: 13
  prod:
    hot_window_months: 13
