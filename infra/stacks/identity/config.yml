# Identity stack configuration.
#
# Non-sensitive and either shared or per-environment. Secrets NEVER appear
# here — each provider's client secret is a shell parameter seeded out of band
# (see the identity module), and the session key is generated by Terraform.

app_name: fit
region: ap-southeast-2

# EntraID directory. One tenant across every environment: the environments are
# separated by which app registration and which allow-list they use, not by
# which directory they trust.
entra_tenant_id: "89e9e78f-7730-4825-b42f-fb0986fe3088"

# Google OAuth web client. One credential across every environment, for the same
# reason as the single Entra registration: three would mean three secrets to
# rotate and three consent screens, to separate environments already separated
# by their allow-list and their own signing key (ADR-0035).
#
# Every admitted hostname must be registered as a redirect URI on this client,
# or that environment fails at the callback with `redirect_uri_mismatch`.
google_client_id: "802427878894-5vgfnqnapp0g84r2psvtdccr6jo8cdig.apps.googleusercontent.com"

environments:
  dev:
    fqdn: fit-dev.jpeak.ai
    entra_client_id: "9f4078bd-0dac-4bb1-9e56-303979d33eb1"
    allowed_users:
      # One list across providers. The Entra address is admitted only with a
      # matching `tid`; the Google address only with `email_verified` (ADR-0035).
      - jp@jpeakai.onmicrosoft.com
      - joshpeak05@gmail.com
    # Short sessions in dev so an expiry bug surfaces during a working day
    # rather than eight hours after anyone stopped looking.
    session_ttl_seconds: 3600
  test:
    fqdn: fit-test.jpeak.ai
    entra_client_id: "9f4078bd-0dac-4bb1-9e56-303979d33eb1"
    allowed_users:
      # One list across providers. The Entra address is admitted only with a
      # matching `tid`; the Google address only with `email_verified` (ADR-0035).
      - jp@jpeakai.onmicrosoft.com
      - joshpeak05@gmail.com
    session_ttl_seconds: 28800
  prod:
    fqdn: fit.jpeak.ai
    entra_client_id: "9f4078bd-0dac-4bb1-9e56-303979d33eb1"
    allowed_users:
      # One list across providers. The Entra address is admitted only with a
      # matching `tid`; the Google address only with `email_verified` (ADR-0035).
      - jp@jpeakai.onmicrosoft.com
      - joshpeak05@gmail.com
    session_ttl_seconds: 28800
