# Identity stack configuration.
#
# Non-sensitive and either shared or per-environment. Secrets NEVER appear
# here — the EntraID client secret is a shell parameter seeded out of band
# (see the identity module), and the session key is generated by Terraform.

app_name: fit
region: ap-southeast-2

# EntraID directory. One tenant across every environment: the environments are
# separated by which app registration and which allow-list they use, not by
# which directory they trust.
entra_tenant_id: "89e9e78f-7730-4825-b42f-fb0986fe3088"

environments:
  dev:
    fqdn: fit-dev.jpeak.ai
    entra_client_id: "9f4078bd-0dac-4bb1-9e56-303979d33eb1"
    allowed_users:
      - jp@jpeakai.onmicrosoft.com
    # Short sessions in dev so an expiry bug surfaces during a working day
    # rather than eight hours after anyone stopped looking.
    session_ttl_seconds: 3600
  test:
    fqdn: fit-test.jpeak.ai
    entra_client_id: "9f4078bd-0dac-4bb1-9e56-303979d33eb1"
    allowed_users:
      - jp@jpeakai.onmicrosoft.com
    session_ttl_seconds: 28800
  prod:
    fqdn: fit.jpeak.ai
    entra_client_id: "9f4078bd-0dac-4bb1-9e56-303979d33eb1"
    allowed_users:
      - jp@jpeakai.onmicrosoft.com
    session_ttl_seconds: 28800
